name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up the Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Run host tests and build the app
        env:
          ASTERHELM_PUBLIC_ORIGIN: https://assistant.example.test
        run: |
          node --test android/tests/android-host.test.mjs
          python3 android/build.py

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the version and prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, xml.etree.ElementTree as ET
          from pathlib import Path

          tag = os.environ["TAG"]
          version = json.loads(Path("package.json").read_text())["version"]
          android = ET.parse("android/AndroidManifest.xml").getroot()
          if not re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", tag):
              raise SystemExit("Expected a stable semantic version tag")
          if tag != "v" + version or android.get("{http://schemas.android.com/apk/res/android}versionName") != version:
              raise SystemExit("Tag, package version and Android version must match")
          sections = re.split(r"^## ", Path("CHANGELOG.md").read_text(), flags=re.M)
          entry = next((s for s in sections[1:] if s.splitlines()[0].split(" · ")[0] == version), None)
          if not entry or not entry.partition("\n")[2].strip():
              raise SystemExit("Add this version to CHANGELOG.md before tagging")
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(entry.partition("\n")[2].strip() + "\n")
          PYTHON
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Asterhelm $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
